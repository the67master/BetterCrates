name: BetterCrates
version: 1.1.0
main: me.aldo.bettercrates.BetterCrates
author: Aldo
description: Customizable crates plugin for Spigot 1.12.2

commands:
  bc:
    description: Panel de administración de BetterCrates
    usage: /bc
    aliases: [bettercrates]

permissions:
  bettercrates.admin:
    description: Permite administrar BetterCrates
    default: op
  bettercrates.use:
    description: Permiso base reservado para abrir crates
    default: true
