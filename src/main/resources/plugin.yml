name: BetterCrates
version: 1.3.0
main: me.aldo.bettercrates.BetterCrates
author: Aldo
description: Customizable crates and KeyAll plugin for Spigot 1.12.2
softdepend: [PlaceholderAPI]
commands:
  bc:
    description: BetterCrates administration
    usage: /bc
    aliases: [bettercrates]
permissions:
  bettercrates.admin:
    description: Allows administration of BetterCrates
    default: op
  bettercrates.use:
    description: Base permission to use BetterCrates
    default: true
