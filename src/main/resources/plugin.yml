name: BetterCrates
version: 1.2.0
main: me.aldo.bettercrates.BetterCrates
author: Aldo
description: Customizable crates and KeyAll plugin for Spigot 1.12.2
softdepend: [PlaceholderAPI]
commands:
  bc:
    description: Panel y administración de BetterCrates
    usage: /bc
    aliases: [bettercrates]
permissions:
  bettercrates.admin:
    description: Permite administrar BetterCrates
    default: op
  bettercrates.use:
    description: Permiso base para usar BetterCrates
    default: true
